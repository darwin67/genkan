[package]
name = "genkan-output-selection"
version = "0.1.0"
edition = "2021"
description = "Output selection policy shared by Genkan login and lock backends"
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
wayland = ["dep:wayland-client", "dep:wayland-protocols-wlr", "dep:serde_json"]

[dependencies]
wayland-client = { version = "=0.31.15", optional = true }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"], optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
proptest = "1.6"
