[package]
name = "genkan"
version = "0.1.0"
edition = "2021"
description = "A small graphical greetd frontend for Wayland"
license = "MIT"

[workspace]
members = ["crates/lock-auth", "crates/output-selection", "crates/session-lock"]
default-members = [".", "crates/lock-auth", "crates/output-selection", "crates/session-lock"]
resolver = "2"

[features]
default = ["gui"]
e2e = ["tokio/macros", "tokio/rt"]
# Enables the deterministic authorization source used by session-lock tests.
# The production Nix package never enables this feature.
lock-test = ["genkan-session-lock/lock-test"]
gui = [
    "dep:base64",
    "dep:bytes",
    "dep:calloop",
    "dep:calloop-wayland-source",
    "dep:chrono",
    "dep:cosmic-text",
    "dep:genkan-lock-auth",
    "dep:genkan-session-lock",
    "dep:gstreamer",
    "dep:gstreamer-app",
    "dep:gstreamer-video",
    "dep:image",
    "dep:iced",
    "dep:iced_runtime",
    "dep:libc",
    "dep:libheif-rs",
    "dep:plist",
    "dep:quick-xml",
    "dep:rclip-desktop-entry",
    "dep:rustix",
    "dep:smithay-client-toolkit",
    "dep:unicode-general-category",
    "dep:wayland-client",
    "dep:zeroize",
    "dep:zbus",
    "tokio/rt",
]

[[bin]]
name = "genkan"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "genkan-greetd-e2e"
path = "src/bin/greetd-e2e.rs"
required-features = ["e2e"]

[dependencies]
base64 = { version = "0.22.1", optional = true }
bytes = { version = "1.10.1", optional = true }
calloop = { version = "=0.14.4", optional = true }
calloop-wayland-source = { version = "=0.4.1", optional = true }
chrono = { version = "0.4.38", default-features = false, features = ["clock"], optional = true }
clap = { version = "4.5.23", features = ["derive"] }
cosmic-text = { version = "0.15.0", optional = true }
genkan-output-selection = { path = "crates/output-selection" }
genkan-session-lock = { path = "crates/session-lock", optional = true }
genkan-lock-auth = { path = "crates/lock-auth", optional = true }
greetd_ipc = { version = "0.10.3", features = ["tokio-codec"] }
gstreamer = { version = "0.24.2", features = ["v1_26"], optional = true }
gstreamer-app = { version = "0.24.2", features = ["v1_26"], optional = true }
gstreamer-video = { version = "0.24.2", features = ["v1_26"], optional = true }
image = { version = "0.24.9", default-features = false, features = ["jpeg"], optional = true }
iced = { version = "0.14.0", default-features = false, features = ["advanced", "canvas", "crisp", "image-without-codecs", "lazy", "thread-pool", "tiny-skia", "tokio", "wayland", "wgpu"], optional = true }
iced_runtime = { version = "0.14.0", optional = true }
libc = { version = "=0.2.189", optional = true }
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_23"], optional = true }
plist = { version = "1.10.1", default-features = false, optional = true }
quick-xml = { version = "0.42.0", default-features = false, optional = true }
rclip-desktop-entry = { version = "0.1.0", features = ["alloc"], optional = true }
rustix = { version = "1.1.4", features = ["fs", "process", "time"], optional = true }
smithay-client-toolkit = { version = "=0.20.0", default-features = false, optional = true }
thiserror = "2.0.9"
tokio = { version = "1.42.0", features = ["net", "sync", "time"] }
unicode-general-category = { version = "1.1.0", optional = true }
wayland-client = { version = "=0.31.15", optional = true }
zeroize = { version = "=1.9.0", optional = true }
zbus = { version = "5.2.0", default-features = false, features = ["tokio"], optional = true }

[dev-dependencies]
tokio = { version = "1.42.0", features = ["macros", "rt"] }

[profile.release]
lto = "thin"
strip = true
