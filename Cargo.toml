[package]
name = "genkan"
version = "0.1.0"
edition = "2021"
description = "A small graphical greetd frontend for Wayland"
license = "MIT"

[workspace]
members = ["crates/lock-auth", "crates/output-selection", "crates/session-lock"]
default-members = [".", "crates/lock-auth", "crates/output-selection", "crates/session-lock"]
exclude = ["fuzz"]
resolver = "2"

[features]
default = ["gui"]
e2e = ["tokio/macros", "tokio/rt"]
# Enables the deterministic authorization source used by session-lock tests.
# The production Nix package never enables this feature.
lock-test = ["genkan-session-lock/lock-test"]
# Parser/decoder support shared with the GUI, without iced, GStreamer, D-Bus,
# or the session-lock runtime. Fuzz targets never open/decode native images.
heic = [
    "dep:base64",
    "dep:libc",
    "dep:libheif-rs",
    "dep:moxcms",
    "dep:plist",
    "dep:quick-xml",
    "dep:rustix",
]
fuzzing = ["heic", "dep:rclip-desktop-entry"]
gui = [
    "heic",
    "dep:bytes",
    "dep:calloop",
    "dep:calloop-wayland-source",
    "dep:chrono",
    "dep:cosmic-text",
    "dep:futures-util",
    "dep:genkan-lock-auth",
    "dep:genkan-session-lock",
    "genkan-output-selection/wayland",
    "dep:gstreamer",
    "dep:gstreamer-app",
    "dep:gstreamer-video",
    "dep:image",
    "dep:iced",
    "dep:iced_runtime",
    "dep:rclip-desktop-entry",
    "dep:seccompiler",
    "dep:sha2",
    "dep:smithay-client-toolkit",
    "dep:tiny-skia",
    "dep:tempfile",
    "dep:toml",
    "tokio/macros",
    "tokio/process",
    "tokio/rt",
    "tokio/signal",
    "dep:unicode-general-category",
    "dep:wayland-client",
    "dep:xkbcommon",
    "dep:zeroize",
    "dep:zbus",
    "dep:zune-core",
    "dep:zune-jpeg",
    "dep:zip",
]

[[bin]]
name = "genkan"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "genkan-greetd-e2e"
path = "src/bin/greetd-e2e.rs"
required-features = ["e2e"]

[dependencies]
base64 = { version = "0.22.1", optional = true }
bytes = { version = "1.10.1", optional = true }
calloop = { version = "=0.14.4", optional = true }
calloop-wayland-source = { version = "=0.4.1", optional = true }
chrono = { version = "0.4.38", default-features = false, features = ["clock"], optional = true }
clap = { version = "4.5.23", features = ["derive"] }
cosmic-text = { version = "0.15.0", optional = true }
futures-util = { version = "0.3.34", default-features = false, optional = true }
genkan-output-selection = { path = "crates/output-selection" }
genkan-session-lock = { path = "crates/session-lock", optional = true }
genkan-lock-auth = { path = "crates/lock-auth", optional = true }
greetd_ipc = { version = "0.10.3", features = ["tokio-codec"] }
gstreamer = { version = "0.24.2", features = ["v1_26"], optional = true }
gstreamer-app = { version = "0.24.2", features = ["v1_26"], optional = true }
gstreamer-video = { version = "0.24.2", features = ["v1_26"], optional = true }
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png"], optional = true }
iced = { version = "0.14.0", default-features = false, features = ["advanced", "canvas", "crisp", "image-without-codecs", "lazy", "sysinfo", "thread-pool", "tiny-skia", "tokio", "wayland", "wgpu"], optional = true }
iced_runtime = { version = "0.14.0", optional = true }
libc = { version = "=0.2.189", optional = true }
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_23"], optional = true }
# The default feature set includes the LUT transform paths that ICC v2 and v4
# `mntr`/`RGB ` profiles depend on, plus runtime-detected SIMD acceleration for
# the per-pixel conversion.
moxcms = { version = "0.8.1", optional = true }
plist = { version = "1.10.1", default-features = false, optional = true }
quick-xml = { version = "0.42.0", default-features = false, optional = true }
rclip-desktop-entry = { version = "0.1.0", features = ["alloc"], optional = true }
rustix = { version = "1.1.4", features = ["fs", "process", "time"], optional = true }
seccompiler = { version = "0.5.0", optional = true }
sha2 = { version = "0.10.9", optional = true }
tiny-skia = { version = "0.11.4", default-features = false, features = ["std"], optional = true }
tempfile = { version = "3.27.0", optional = true }
toml = { version = "1.1.4", optional = true }
smithay-client-toolkit = { version = "=0.20.0", default-features = false, optional = true }
thiserror = "2.0.9"
tokio = { version = "1.42.0", features = ["net", "sync", "time"] }
unicode-general-category = { version = "1.1.0", optional = true }
wayland-client = { version = "=0.31.15", features = ["system"], optional = true }
xkbcommon = { version = "0.8.0", optional = true }
zeroize = { version = "=1.9.0", optional = true }
zbus = { version = "5.2.0", default-features = false, features = ["tokio"], optional = true }
zune-core = { version = "0.4", optional = true }
zune-jpeg = { version = "0.4", optional = true }
zip = { version = "2.4.2", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
proptest = "1.6"
proptest-state-machine = "0.8"
tokio = { version = "1.42.0", features = ["macros", "rt"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
strip = true
