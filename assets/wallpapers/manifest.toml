# Immutable dynamic HEIC assets. `delivery = "repository"` assets are pinned by
# their committed bytes; a catalog asset delivered from the R2 host records
# `delivery = "r2"` with `r2_url` and `nix_hash` and is fetched as a
# hash-pinned fixed-output source exactly like the MOV catalog. No HEIC asset is
# downloaded while a wallpaper process runs.

