schema_version = 1
catalog_id = "genkan-wallpapers"
default_wallpaper = "tahoe-beach"
verified_at = "2026-11-11"

[delivery]
r2_bucket = "genkan-assets"
base_url = "https://assets.genkan.dwu.sh/wallpapers/"
# Objects are split by format under the base URL: `mov/` holds the MOV videos
# and `heic/` holds the dynamic HEIC assets. The installed tree mirrors it, so
# `share/genkan/wallpapers/mov` and `share/genkan/wallpapers/heic` name the
# format rather than mixing both in one directory.
content_type = "video/quicktime"
cache_control = "public, max-age=31536000, immutable"
cache_rule_id = "36ea271e0e884369ae43b5328d2c817f"
cache_rule_expression = "(http.host eq \"assets.genkan.dwu.sh\" and starts_with(http.request.uri.path, \"/wallpapers/\"))"
smart_tiered_cache = true
# Informational CDN threshold, not a maximum permitted Nix input size.
maximum_cacheable_object_bytes = 536870912
maximum_cacheable_object_source = "Cloudflare Free plan 512 MB cacheable file-size limit"
verification = "The original MOV catalog's complete and byte-range responses were SHA-256 checked with CDN HIT responses. The seven originals added on 2026-11-11 passed full S3 readback SHA-256 verification and public head/tail byte checks. Oversized MOVs returned BYPASS; some range requests returned complete 200 responses rather than 206, so consistent range delivery is not asserted. Nix verifies complete objects; playback is local."

[loop_analysis]
# The original five values were re-derived on 2026-09-21 with ffmpeg 8.1.2;
# the four aerials added on 2026-11-11 use ffmpeg 7.1.5. Their full-resolution
# lossless endpoint PNGs are scaled after extraction, as distinguished below.
metric = "ssim"
tool = "ffmpeg 8.1.2 (original five) and 7.1.5 (Iceland, Greenland, Patagonia, Palau Jellies), with the `ssim` filter"
comparison = "first decoded frame vs final decoded frame, each scaled to the entry's endpoint_comparison_width and endpoint_comparison_height"
# Substitute SRC, ID, W and H. The frames are compared as decoded PNG pixels rather
# than through an intermediate lossy format, so the result depends only on the
# decoder and the scaling filter.
procedure = '''
N=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 SRC)
case ID in
  iceland|greenland|patagonia|palau-jellies)
    ffmpeg -v error -y -i SRC -vf "select=eq(n\,0)" -vsync 0 -frames:v 1 first-full.png
    ffmpeg -v error -y -i SRC -vf "select=eq(n\,$((N-1)))" -vsync 0 -frames:v 1 last-full.png
    ffmpeg -v error -y -i first-full.png -vf scale=W:H first.png
    ffmpeg -v error -y -i last-full.png -vf scale=W:H last.png
    ;;
  *)
    ffmpeg -v error -y -i SRC -vf "scale=W:H,select=eq(n\,0)" -vsync 0 -frames:v 1 first.png
    ffmpeg -v error -y -i SRC -vf "scale=W:H,select=eq(n\,$((N-1)))" -vsync 0 -frames:v 1 last.png
    ;;
esac
ffmpeg -i first.png -i last.png -lavfi ssim -f null -
'''
# A short backward seek does not reliably produce the final frame of these HEVC
# sources: ffmpeg reports missing reference pictures and the extracted frame
# varies. Decoding from the start and selecting by frame index is what makes the
# recorded value reproducible.
caveat = "HEVC reference frames make short-seek extraction of the final frame unreliable; decode from the start and select by index."
# The final frame is selected by index among the frames the decoder actually
# produced, so `nb_read_frames` is authoritative rather than the container's
# declared `frame_count`. The decoded counts are tahoe-beach 28,801,
# sequoia-sunrise 28,802, sequoia-morning 58,401, sequoia-night 69,985, and
# golden-gate 14,386. Sequoia Sunrise and Golden Gate declare more frames than
# decode (28,806 and 14,400), and selecting by those declared counts produces no
# frame at all rather than a reproducible endpoint.
reproducible_for = "tahoe-beach, sequoia-sunrise, sequoia-morning, sequoia-night, golden-gate, iceland, greenland, patagonia, palau-jellies"

