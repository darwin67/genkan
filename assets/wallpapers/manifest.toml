# (ispe + one coding unit)^2 before handing bytes to the decoder. This fixture's
# SPS declares a 160x64 coded picture that crops to the declared 8x8, so the
# tightened 5184-pixel ceiling rejected it even though the bytes are valid.
# libheif 1.23.3 added a 65536-pixel floor to that tightening (upstream issue
# #1856), which accepts this coded size again; decoding therefore requires
# libheif 1.23.3 or later.
