name: Prepare release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-release-main
  cancel-in-progress: true

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: RELEASE
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - name: Prepare version, changelog and PR notes
        id: release
        run: |
          tag=$(nix shell --inputs-from . nixpkgs#git-cliff --command python3 scripts/release-metadata.py prepare)
          if [[ -n "$tag" ]]; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            python3 scripts/release-metadata.py notes "chore(release): $tag" > "$RUNNER_TEMP/release-notes.md"
          fi

      # An App token lets release PRs trigger the same checks as human PRs.
      - name: Create release bot token
        if: steps.release.outputs.tag != ''
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update the rolling release PR
        if: steps.release.outputs.tag != ''
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: release/next
          base: main
          title: "chore(release): ${{ steps.release.outputs.tag }}"
          commit-message: "chore(release): ${{ steps.release.outputs.tag }}"
          body-path: ${{ runner.temp }}/release-notes.md
          add-paths: |
            CHANGELOG.md
            Cargo.toml
            Cargo.lock
            fuzz/Cargo.lock
