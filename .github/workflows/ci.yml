name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "rfd/**"
      - "scripts/**"
      - "tests/**"
      - "cliff.toml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/commits.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "rfd/**"
      - "scripts/**"
      - "tests/**"
      - "cliff.toml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/commits.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-fmt-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fmt-cargo-
            ${{ runner.os }}-cargo-

      - run: nix develop --command make fmt

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-lint-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-lint-cargo-
            ${{ runner.os }}-cargo-

      - run: nix develop --command make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-test-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-test-cargo-
            ${{ runner.os }}-cargo-

      - run: nix develop --command make test
      - run: nix develop --command make check-rfds

  dynamic-heic-imageio:
    name: Dynamic HEIC ImageIO
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify the synthetic fixture with ImageIO
        run: |
          swift tests/fixtures/dynamic-heic/verify-imageio.swift \
            tests/fixtures/dynamic-heic/synthetic-all-properties.heic \
            > "$RUNNER_TEMP/synthetic-imageio.json"
      - name: Check out the independent HEIC author
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: mczachurski/wallpapper
          ref: 64d6e2b2088c990e0e7ea0deff8710bca93233fa
          path: external/wallpapper
          persist-credentials: false
      - name: Author and verify the independent fixture
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/wallpapper-fixture"
          swift tests/fixtures/dynamic-heic/generate-png-inputs.swift "$fixture"
          cat > "$fixture/config.json" <<'JSON'
          [
            {"fileName":"00-red.png","isPrimary":true,"isForLight":true,"time":"00:00:00"},
            {"fileName":"06-green.png","time":"06:00:00"},
            {"fileName":"12-blue.png","time":"12:00:00"},
            {"fileName":"18-white.png","isForDark":true,"time":"18:00:00"}
          ]
          JSON
          swift build --package-path external/wallpapper \
            --configuration release --arch arm64 --arch x86_64
          external/wallpapper/.build/apple/Products/Release/wallpapper \
            -i "$fixture/config.json" -o "$fixture/imageio-wallpapper-h24.heic" -q 1.0
          external/wallpapper/.build/apple/Products/Release/wallpapper \
            -e "$fixture/imageio-wallpapper-h24.heic" \
            > "$fixture/wallpapper-extraction.txt"
          swift tests/fixtures/dynamic-heic/verify-imageio.swift \
            "$fixture/imageio-wallpapper-h24.heic" h24 \
            > "$fixture/imageio-verification.json"
          shasum -a 256 "$fixture/imageio-wallpapper-h24.heic" \
            > "$fixture/sha256.txt"
      - name: Preserve ImageIO evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dynamic-heic-imageio-evidence
          path: |
            ${{ runner.temp }}/synthetic-imageio.json
            ${{ runner.temp }}/wallpapper-fixture/imageio-wallpapper-h24.heic
            ${{ runner.temp }}/wallpapper-fixture/imageio-verification.json
            ${{ runner.temp }}/wallpapper-fixture/sha256.txt
            ${{ runner.temp }}/wallpapper-fixture/wallpapper-extraction.txt
          if-no-files-found: error

  greetd-e2e:
    name: greetd E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - run: nix build .#checks.x86_64-linux.greetd-e2e --print-build-logs

  session-lock-vm:
    name: Session-lock VM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - run: nix build .#checks.x86_64-linux.session-lock-vm --print-build-logs

  package:
    name: Package and graphics smoke (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - name: NixOS module and PAM policy
        run: nix build .#checks.${{ matrix.system }}.module --print-build-logs
      # Graphics checks use software rendering and must not compete for runner CPU.
      - name: Graphics smoke
        run: nix build .#checks.${{ matrix.system }}.graphics-smoke --print-build-logs
      - name: Session-lock smoke
        run: nix build .#checks.${{ matrix.system }}.session-lock-smoke --print-build-logs
      - name: Preview evidence
        run: nix build .#checks.${{ matrix.system }}.preview-evidence --print-build-logs
