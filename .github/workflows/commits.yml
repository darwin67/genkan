name: Conventional Commits

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  validate-commits:
    name: Validate commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate non-merge commit subjects
        run: ./scripts/check-commits.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  validate-pr-title:
    name: Validate title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: ytanikin/pr-conventional-commits@639145d78959c53c43112365837e3abd21ed67c1 # 1.5.2
        with:
          # Keep this list aligned with the commit parsers in cliff.toml.
          add_label: "false"
          task_types: >-
            ["feat", "fix", "doc", "docs", "test", "ci", "refactor",
            "perf", "chore", "revert", "style", "security"]
