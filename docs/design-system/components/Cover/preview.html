<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Genkan</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--accent); color: var(--text-primary); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .disc-a { fill: var(--avatar-top); }
  .disc-b { fill: var(--avatar-bottom); }
  .ring { fill: none; stroke: var(--avatar-ring); stroke-width: 1.5; }
  .pill { fill: var(--field-glass); stroke: var(--field-border); stroke-width: 1; }
  .glass { fill: var(--clock-glass); }
  .item { fill: var(--item-active); }
  .words { position: absolute; left: 32px; bottom: 32px; max-width: 440px; }
  .name { margin: 0; font-size: 112px; line-height: .92; font-weight: 800; letter-spacing: -.03em; }
  .tag { margin: 8px 0 0 4px; font-size: 14px; line-height: 20px; color: var(--text-date); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      clock-glass slab 220×120 bled off the top (the glass clock) · avatar-top and avatar-bottom discs at avatar-size 75 · three field-glass pills at field-width 142 × field-height 22 · item-active chips at bar-height 22
  arrangement the login screen itself: a status-bar strip at top right, the clock slab above, a row of avatar discs over their pills low on the ground
  pattern     discs and pills, from "small and low": the identity column repeated as an account row
  scales      gaps identity-gap 12 and account-gap 36; corners radius-field 11, radius-item 6; discs radius-round
-->
<rect class="item" x="300" y="8" width="56" height="22" rx="6"/>
<rect class="item" x="364" y="8" width="30" height="22" rx="6"/>
<rect class="item" x="402" y="8" width="46" height="22" rx="6"/>
<rect class="glass" x="40" y="-40" width="220" height="120" rx="11"/>
<circle class="disc-a" cx="88" cy="168" r="37.5"/>
<circle class="ring" cx="88" cy="168" r="37.5"/>
<circle class="disc-b" cx="234" cy="168" r="37.5"/>
<circle class="ring" cx="234" cy="168" r="37.5"/>
<circle class="disc-a" cx="380" cy="168" r="37.5"/>
<circle class="ring" cx="380" cy="168" r="37.5"/>
<rect class="pill" x="17" y="218" width="142" height="22" rx="11"/>
<rect class="pill" x="163" y="218" width="142" height="22" rx="11"/>
<rect class="pill" x="309" y="218" width="142" height="22" rx="11"/>
</svg>
</div>
<div class="words">
<h1 class="name">Genkan</h1>
<p class="tag">A greetd login screen and session lock that follows macOS.</p>
</div>
</div>
</body>
</html>
