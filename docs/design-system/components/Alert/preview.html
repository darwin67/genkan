<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Alert</title></head>
<body>
<div class="gk-stage"><div class="gk-scrim"></div><div class="gk-alert" role="alertdialog" aria-labelledby="t" aria-describedby="b">
<div class="gk-alert__icon"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 3v6.4"/><path d="M6.2 5.7a5.6 5.6 0 1 0 7.6 0"/></svg></div>
<div class="gk-alert__title" id="t">Are you sure you want to shut down your computer now?</div>
<div class="gk-alert__body" id="b">Anyone still signed in will lose unsaved work.</div>
<div class="gk-alert__actions"><button class="gk-pill gk-pill--secondary is-focused">Cancel</button><button class="gk-pill gk-pill--default">Shut Down</button></div>
</div></div>
</body>
</html>
