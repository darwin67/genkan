<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Avatar</title></head>
<body>
<div class="gk-stage gk-row">
  <div class="gk-avatar" role="img" aria-label="Lake account picture" style="background: url('../../../../assets/avatars/lake.png') center / cover"></div>
  <div class="gk-avatar is-focused" role="img" aria-label="Moon account picture, keyboard focused" style="background: url('../../../../assets/avatars/moon.png') center / cover"></div>
  <div class="gk-avatar" role="img" aria-label="DW initials while the picture loads">DW</div>
  <div class="gk-avatar" role="img" aria-label="B initials when the picture fails to load">B</div>
</div>
</body>
</html>
